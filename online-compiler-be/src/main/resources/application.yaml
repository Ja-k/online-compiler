server:
  port: 9191
  servlet:
    session:
      cookie:
        same-site: lax
  error:
    # devtools defaults this to ALWAYS in dev, which leaks full Java stack
    # traces to API clients (as seen in bean-validation error bodies).
    include-stacktrace: never
    include-message: always
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.online_compiler.online_compiler_be: DEBUG
  file:
    name: ../logs/online-compiler.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

spring:
  application:
    name: online-compiler-be
  datasource:
    # createDatabaseIfNotExist provisions the `online_compiler` schema on first
    # connection so no manual `CREATE DATABASE` step is needed for local dev.
    # DB_HOST/DB_PORT let a containerized backend point at a sibling MySQL
    # container (e.g. -e DB_HOST=online-compiler-mysql) instead of localhost.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/online_compiler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      # No migration tool (Flyway/Liquibase) is set up yet, so Hibernate
      # manages the `users` / `saved_files` tables directly from the entities.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  mail:
    # Points at a local Mailpit container for dev (no real SMTP provider
    # needed): docker run -d --name compiler-mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit
    # Web UI to view "sent" emails: http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  data:
    redis:
      # docker run -d --name compiler-redis -p 6379:6379 redis:7-alpine
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  # Base URL of the frontend, used to build links inside verification emails.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  rate-limit:
    # Token-bucket limits per client IP. capacity = burst size allowed
    # back-to-back; refill-per-minute = sustained rate afterwards.
    run:
      capacity: 10
      refill-per-minute: 10
    auth:
      capacity: 20
      refill-per-minute: 20
  mail:
    from: no-reply@online-compiler.local
  auth:
    verification-token-validity-hours: 24
  cache:
    code-execution:
      # How long an identical (language, version, code) result is served
      # from Redis before it's recomputed by actually running the code again.
      ttl-hours: 24
