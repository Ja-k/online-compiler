<!-- src/app/app.component.html -->
<div class="app-header">
  @if (authService.isAuthenticated()) {
    <button
      type="button"
      class="hamburger-button"
      (click)="onHamburgerClick()"
      aria-label="Open my files"
      title="My files"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  } @else {
    <span class="hamburger-placeholder"></span>
  }

  <h1>Online Compiler</h1>

  <div class="auth-controls">
    <button
      type="button"
      class="theme-toggle"
      (click)="onThemeToggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (themeService.isDark()) {
        <span aria-hidden="true">☀</span>
      } @else {
        <span aria-hidden="true">☾</span>
      }
    </button>
    @if (authService.isAuthenticated()) {
      <span class="username">{{ authService.currentUser()?.username }}</span>
      <button type="button" class="auth-link logout-link" (click)="onLogoutClick()">Logout</button>
    } @else {
      <a class="auth-link" routerLink="/login">Login</a>
      <a class="auth-link auth-link--primary" routerLink="/register">Register</a>
    }
  </div>
</div>

<router-outlet></router-outlet>

<app-files-drawer></app-files-drawer>
