<div class="editor-toolbar">
  <div class="language-selector">
    <select
      class="language-select"
      [(ngModel)]="selectedLanguage"
      (ngModelChange)="onLanguageChange()"
      [disabled]="isRunning"
    >
      @for (lang of languages; track lang.id) {
        <option [ngValue]="lang">{{ lang.label }}</option>
      }
    </select>
    <select class="version-select" [(ngModel)]="selectedVersion" [disabled]="isRunning">
      @for (version of selectedLanguage.versions; track version) {
        <option [ngValue]="version">{{ selectedLanguage.label }} {{ version }}</option>
      }
    </select>
  </div>
  <button
    type="button"
    class="run-button"
    (click)="runCode()"
    [disabled]="isRunning"
  >
    @if (isRunning) {
      <span class="spinner"></span>
      Running…
    } @else {
      ▶ Run
    }
  </button>
</div>
<ngx-monaco-editor
  id="ngx-monaco-editor-id"
  class="editor-container"
  [options]="editorOptions"
  [(ngModel)]="code"
></ngx-monaco-editor>
